server.port=8081
spring.application.name=MAILING-SERVICE

#SPRING CLOUD CONFIGURATION
eureka.instance.preferIpAddress=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE:http://localhost:8761/eureka/}

# ===========================================================
#- EMAIL-PROPERTIES
# ===========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${EMAIL_NAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=true

# application properties
application.mail.sender = ${EMAIL_NAME}

# jwt settings
application.security.jwt.secret = ${JWT_SECRET}


logging.level.org.springframework.security=DEBUG